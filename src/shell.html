/* ---- shared: identical in both apps ---- */
:root{
  --font:"Manrope",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;            /* cards */
  --r-s:12px;          /* buttons, inputs, inner tiles */

  --heat-orange:#FF6518; --flame-gold:#FFB900;
  --on-brand:#FFFFFF;
  /* status: same meaning and colour in both apps (always paired with text or a symbol) */
  --st-heating:#F28C28; --ok:#18866A; --info:#2386BD; --warn:#B76D00; --bad:#C62828; --off:#70747D;
}

/* ---- Seewärme: calm, alpine, refined ---- */
:root[data-brand="see"]{
  --bg:#F6FAFC; --card:#FFFFFF; --ink:#24232A; --ink-2:#565B64; --ink-3:#70747D; --line:#E1E9EF; --chip:#EAF1F6;
  --brand:#075A91; --brand-deep:#00365B; --brand-2:#008DB8;
  --brand-grad:linear-gradient(135deg,#00365B 0%,#075A91 55%,#0099C1 100%);
  --accent:#075A91; --accent-soft:#E2EEF6;            /* active nav, primary buttons, selection, focus */
  --ember:#E3570E; --ember-strong:#FF6518; --ember-soft:#FFE8DA;  /* heating active */
  --lake:#0A7DA6; --lake-soft:#DDEFF6;                 /* cool / night / below target */
  --c-measured:#075A91; --c-target:#FF6518; --c-activity:#F2A600;  /* charts */
  --shadow:0 1px 2px rgba(0,54,91,.05),0 0 0 1px rgba(0,54,91,.055);
}
/* ---- Wien Wärme: warm, urban, energetic ---- */
:root[data-brand="wien"]{
  --bg:#FFF8F1; --card:#FFFFFF; --ink:#24232A; --ink-2:#5B5A5F; --ink-3:#70747D; --line:#F0E5DA; --chip:#F8EEE4;

  --shadow:0 1px 2px rgba(80,20,10,.05),0 0 0 1px rgba(80,20,10,.055);
}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01";margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lake);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.shell{min-height:100%;display:grid;grid-template-columns:1fr}
.rail{display:none}
main{padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:560px;width:100%;margin:0 auto}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:560px;margin:0 auto}
.tabs .nav span{font-size:10.5px;letter-spacing:-.01em}
.nav{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-3);padding:6px 0;min-height:48px}
.nav svg{width:24px;height:24px}
.nav[aria-current="page"]{color:var(--ink)}
.nav[aria-current="page"] svg{color:var(--ember-strong)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.brand img{width:22px;height:28px}
.brand .wm-sub{font-weight:400;color:var(--ink-3);font-size:13px;letter-spacing:0}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:18px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.conn.live i{background:var(--ok)}

@media (min-width:760px){
  .shell{grid-template-columns:88px minmax(0,1fr)}
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:calc(18px + env(safe-area-inset-top,0px)) 10px 18px max(10px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
  .rail .logo{display:grid;place-items:center;height:52px;margin-bottom:14px}
  .rail .logo img{width:26px}
  .rail .wm{display:none}
  .rail .nav{border-radius:14px;padding:10px 0;font-size:11px}
  .rail .nav[aria-current="page"]{background:var(--card);box-shadow:var(--shadow)}
  .rail .foot{margin-top:auto;display:grid;place-items:center}
  .rail .foot .conn span{display:none}
  main{max-width:1060px;padding:calc(26px + env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-right,0px)) 48px 32px}
  .topbar{display:none}
}
@media (min-width:1180px){
  .shell{grid-template-columns:236px minmax(0,1fr)}
  .rail{padding:26px 16px 22px}
  .rail .logo{justify-content:start;place-items:center start;padding-left:10px}
  .rail .logo>img{display:none}
  .rail .wm{display:flex}
  .rail .nav{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:14.5px}
  .rail .nav svg{width:21px;height:21px}
  .rail .foot{place-items:start;padding-left:12px}
  .rail .foot .conn span{display:inline}
  main{max-width:1240px;padding:34px 44px 56px}
}

/* ---------- type & blocks ---------- */
.eyebrow{font-size:12.5px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
h1{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:58ch}
.temp-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.outside{text-align:right;padding-bottom:8px}
.outside span{display:block;font-size:12.5px;color:var(--ink-3);letter-spacing:.01em}
.outside b{display:block;font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1.05;color:var(--ink-2)}
.air-note{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:10px 14px;border:0;border-radius:14px;background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--ink);text-align:left;font-size:13.5px;line-height:1.35}
.air-note svg{width:20px;height:20px;flex:none;color:var(--warn)} .air-note b{font-weight:600} .air-note em{font-style:normal;color:var(--ink-2)}
.air-note .chev{margin-left:auto;color:var(--ink-3);width:16px;height:16px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px}
.strip button{border:0;background:none;border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.strip button+button{box-shadow:-1px 0 0 var(--line)}
.strip button:hover{background:var(--chip)}

@media (max-width:420px){.strip{padding:4px}.strip button{padding:10px 2px 9px}.strip b{font-size:19px}.strip span{font-size:12px}}
.strip i{width:6px;height:6px;border-radius:50%;background:var(--ok)} .strip i.hot{background:var(--ember)} .strip i.low{background:var(--lake)} .strip i.off{background:var(--ink-3)}
.strip i.air{background:var(--warn)}

.strip-wrap{display:flex;flex-direction:column;gap:10px}

.bench-row i{width:7px;height:7px;border-radius:50%;background:var(--ok)} .bench-row i.hot{background:var(--ember)} .bench-row i.idle,.bench-row i.off{background:var(--ink-3)}
.bench-row .chev{width:16px;height:16px;color:var(--ink-3)}
.bench-hero{padding-bottom:4px}
.stats.stats3{grid-template-columns:repeat(3,minmax(0,1fr))}

.kv-fixed{font-size:17px;font-weight:500}
.stepper button:disabled{opacity:.4;cursor:default}
.bx-bar .seg{max-width:none}
.m3d-pin.small{padding:3px 13px 4px 9px;border-radius:10px;background:var(--pin)}.m3d-pin.small .n{font-size:10px}.m3d-pin.small b{font-size:12.5px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.facts:empty{display:none}.facts b{color:var(--ink);font-weight:500;font-size:15px;margin-right:4px}
.room .st{display:block}
.room .air{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.room .air.warn{color:var(--warn)}
.wx .src{font-size:12px;color:var(--ink-3)}

.wx-grid{display:grid;gap:18px}

.status i.low{background:var(--lake)}

/* segmented modes */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:16px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;border-radius:12px;min-height:44px;font-weight:500;font-size:14.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.03)}
.mode-note{font-size:13px;color:var(--ink-2);margin:10px 2px 0;min-height:1.4em}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;min-height:40px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.pill svg{width:16px;height:16px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* plan */
.plan svg{width:100%;height:auto;display:block;overflow:visible}
.plan .floor{stroke:var(--line);stroke-width:.6;fill:var(--f-neutral);transition:fill .4s}
.plan .floor.outdoor{fill:var(--f-out)} .plan .floor.ok{fill:var(--f-ok)} .plan .floor.hot{fill:var(--f-hot)} .plan .floor.low{fill:var(--f-low)} .plan .floor.off{fill:var(--f-off)}
.plan .floor[data-room]:not([data-room=""]){cursor:pointer}
.plan .floor.sel{stroke:var(--ink);stroke-width:1.6}
.plan .slab-top{fill:var(--slab)} .plan .slab-side{fill:var(--slab-side)}
.plan .wall .top{fill:var(--wall-top);stroke:var(--wall-top);stroke-width:.4}
.plan .wall .side-a{fill:var(--wall-a);stroke:var(--wall-a);stroke-width:.6}
.plan .wall .side-b{fill:var(--wall-b);stroke:var(--wall-b);stroke-width:.6}
.plan .glass .top{fill:var(--glass-top)} .plan .glass .side-a,.plan .glass .side-b{fill:var(--glass);opacity:.6}
.plan .rail .top{fill:var(--ink-3)} .plan .rail .side-a,.plan .rail .side-b{fill:var(--glass);opacity:.5}
.plan .fireplace .top{fill:var(--fire)} .plan .fireplace .side-a{fill:var(--fire-a)} .plan .fireplace .side-b{fill:var(--fire-b)}
.plan .bed .top{fill:var(--bed)} .plan .bed .side-a,.plan .bed .side-b{fill:var(--bed-side)}
.plan .bench .top{fill:var(--bench)} .plan .bench .side-a,.plan .bench .side-b{fill:var(--bench-side)}
.plan .fire-glow{fill:url(#glow)}
.plan .pin{cursor:pointer}
.plan .pin rect{fill:var(--pin);stroke:var(--pin-line);stroke-width:.7}
.plan .pin.sel rect{stroke:var(--ink);stroke-width:1.2}
.plan .pin-name{font-size:6.8px;fill:var(--ink-2);font-weight:500;font-family:var(--font)}
.plan .pin-temp{font-size:10.5px;fill:var(--ink);font-weight:600;font-family:var(--font);font-variant-numeric:tabular-nums}
.plan .pin-hot{fill:var(--ember-strong)} .plan .pin-dot{fill:var(--ink)}
.plan.mini .pin-name{font-size:7.6px} .plan.mini .pin-temp{font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 3D model */
.m3d{display:none;position:relative;width:100%;aspect-ratio:16/10.4;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,color-mix(in srgb,var(--card) 70%,var(--bg)) 0%,var(--card) 70%)}
.has3d .m3d{display:block} .has3d .plan>svg{display:none}
.m3d-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.m3d-labels{position:absolute;inset:0;pointer-events:none}
.m3d-pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:var(--pin);color:var(--ink);border-radius:12px;padding:5px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 4px 14px rgba(0,0,0,.14),0 0 0 1px var(--pin-line);min-height:0;font-family:var(--font);white-space:nowrap}
.m3d-pin .n{font-size:11px;color:var(--ink-2);font-weight:500;line-height:1.2}
.m3d-pin b{font-size:15px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.m3d-pin i{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 1.5px var(--pin)}
.m3d-pin i.conn.off{background:var(--bad)}
.m3d-pin b{display:inline-flex;align-items:center;gap:3px}
.m3d-pin .up{width:8px;height:10px;fill:none;stroke:var(--ember);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bt-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px;padding:4px 0 6px}
.bt-grid .field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-3)}
.bt-grid input{width:100%;min-width:0}
.tm-on{color:var(--ok);font-weight:500}
.m3d-pin.sel{box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 2px var(--ink)}
.m3d-pin:after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--pin);transform:translateX(-50%) rotate(45deg);box-shadow:1px 1px 0 var(--pin-line)}
.m3d-pin.compact{padding:3px 8px;border-radius:10px}
.m3d-pin.compact .n{display:none}
.m3d-pin.compact b{font-size:13px}
.m3d-pin.compact i{top:4px;right:3px;width:5px;height:5px}
.m3d.fv{background:none}
.fv-stage{position:absolute;inset:0}
.fv-img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.fv-heat{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fv-room{fill:transparent;stroke:transparent;stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;mix-blend-mode:multiply;transition:fill .5s ease,stroke .2s ease}
.fv-room.hot{fill:rgba(255,110,40,.34)} .fv-room.low{fill:transparent} .fv-room.off{fill:rgba(110,110,110,.16)}
@media (hover:hover){.fv-room:not(.hot):not(.low):not(.off):hover{fill:rgba(255,179,107,.12)}}
.fv-room.sel{stroke:var(--ink);mix-blend-mode:normal;fill-opacity:.9}
.m3d-hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--ink-3);pointer-events:none}
@media (min-width:760px){.g-rooms .m3d{aspect-ratio:16/11}}

/* rooms list */
.rooms{display:flex;flex-direction:column}
.room{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 14px;padding:12px 4px;border:0;background:none;text-align:left;border-top:1px solid var(--line);min-height:60px;width:100%}

/* people */

.who .p span{font-size:13px;color:var(--ink-2)}
.topbar .people .ava{margin-left:-10px} .topbar .people .ava:first-child{margin-left:0}

/* stay timeline */
.tl{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.tl:before{content:"";position:absolute;left:5px;right:5px;top:5px;height:2px;background:var(--line);border-radius:2px}
.tl .bar{position:absolute;left:5px;top:5px;height:2px;background:var(--ember-strong);border-radius:2px}
.tl div{position:relative;padding-top:20px;min-width:0}
.tl div:before{content:"";position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.tl div.done:before{border-color:var(--ember-strong);background:var(--ember-strong)}
.tl span{display:block;font-size:12px;color:var(--ink-3)}
.tl b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
input[type="datetime-local"],input.time,select{background:var(--chip);border:1px solid transparent;border-radius:12px;padding:12px 14px;width:100%;min-height:46px;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0;padding-top:2px}
.setting b{font-weight:500}
.setting p{margin:0;font-size:13px;color:var(--ink-2);grid-column:1}
.setting output{font-size:15px;font-weight:500}
input[type="range"]{grid-column:1/-1;width:100%;accent-color:var(--ink);margin:6px 0 0;height:28px}
input.time{width:auto;min-width:112px;font-variant-numeric:tabular-nums}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.switch span:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--lake);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:13px 18px;min-height:48px;font-weight:600;font-size:15px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.warm{background:var(--ember);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:20px;font-weight:400;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper output{min-width:64px;text-align:center;font-size:16px;font-weight:500}
.stepper.sm{gap:2px;padding:3px}.stepper.sm button{width:36px;height:36px;font-size:18px}.stepper.sm output{min-width:50px;font-size:15px}
.dn-head{display:grid;grid-template-columns:minmax(0,1fr) 128px 128px;gap:8px;font-size:12px;color:var(--ink-3);padding:0 0 8px}
.dn-head span{text-align:center}
.dn{display:grid;grid-template-columns:minmax(0,1fr) 128px 128px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dn b{font-weight:500}.dn p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.dn .stepper{justify-self:center}
@media (max-width:520px){.dn-head{grid-template-columns:1fr 1fr}.dn-head span:first-child{display:none}.dn{grid-template-columns:1fr 1fr;row-gap:8px}.dn>div:first-child{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}.dn p{margin:0}}
.today .bar{position:relative;height:12px;border-radius:999px;background:var(--chip);overflow:hidden;margin:6px 0 8px}
.today .bar i{position:absolute;top:0;bottom:0}
.today .bar .n{background:color-mix(in srgb,var(--lake) 42%,transparent)} .today .bar .w{background:color-mix(in srgb,var(--ember) 45%,transparent)}
.today .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.today .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.today .keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.today .keys div{font-size:12px;color:var(--ink-2)}.today .keys b{display:block;font-size:17px;font-weight:500;color:var(--ink);margin-top:2px}
.today .keys i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.today .bar-wrap{position:relative}
.today .keys .kn{background:color-mix(in srgb,var(--lake) 42%,transparent)} .today .keys .kw{background:color-mix(in srgb,var(--ember) 45%,transparent)} .today .keys .kd{background:var(--line)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right}
.note{font-size:13px;color:var(--ink-2);margin:0}
.confirm{background:var(--ember-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}

/* insights */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}

.ebar{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px;padding:6px 0}

.ebar .fill{height:100%;border-radius:3px;background:var(--ember-strong)}

.chart svg{width:100%;height:auto;display:block}

/* sheet */

/* grids for larger screens */

}
@media (min-width:1180px){

.hx-tip span{display:block;opacity:.7;font-size:11.5px}.hx-tip b{font-weight:600}
.hx-tip i,.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.hx-empty{color:var(--ink-3);font-size:14px;padding:50px 0;text-align:center;margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px 0 12px;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--ink-2);min-height:32px}
.chip[aria-pressed="true"]{background:var(--chip);color:var(--ink);border-color:transparent}
.chip.floor i{border-radius:2px}
.legend .est-key{background:none;border:1.2px dashed var(--ember)}
.seg.seg2{grid-template-columns:repeat(2,1fr)}.seg.mini{padding:3px;border-radius:12px}.seg.mini button{min-height:32px;font-size:13px;padding:0 12px;border-radius:9px}
/* ---------- Wärme design system: shared components on the brand tokens ---------- */
:root[data-brand]{--s-out:var(--lake)}
body{font-weight:500;letter-spacing:-.003em;font-feature-settings:normal}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.eyebrow{font-weight:600}
:focus-visible{outline-color:var(--accent)}
.brand{font-weight:700;font-size:18px}
.brand img{width:28px;height:28px;border-radius:7px}
.rail .logo img{width:40px;height:40px;border-radius:10px}
.nav{font-weight:600}
.nav[aria-current="page"],.nav[aria-current="page"] svg{color:var(--accent)}
.rail .nav[aria-current="page"]{background:var(--accent-soft);box-shadow:none}
/* numbers: Manrope ExtraBold for the headline temperature, Bold for figures */
.temp{font-weight:800;font-size:72px;letter-spacing:-.045em;line-height:.95}
.temp sup{font-weight:700;font-size:.36em;vertical-align:1.15em}
.outside b{font-weight:700;font-size:28px;letter-spacing:-.03em}
.strip b,.bench-row b{font-weight:700;letter-spacing:-.02em}
.room .t{font-weight:700;letter-spacing:-.025em}
.stat b{font-weight:700;font-size:26px;letter-spacing:-.025em}
.wx-t{font-weight:700;letter-spacing:-.035em}
.sheet .big{font-weight:800;letter-spacing:-.04em}
.hx-nav b,.kv-fixed,.stepper output{font-weight:700}
.m3d-pin b{font-weight:700}
.room b,.setting b,.co2-dev b,.dn b,.bench-row .bn{font-weight:600}
.status{font-weight:700}
/* shape: 16 px cards, 12 px buttons and inputs */
.stat,.rooms .room{border-radius:var(--r)}
.seg{border-radius:14px}.seg button{border-radius:10px;font-weight:600}
.seg button[aria-pressed="true"]{color:var(--accent)}
.btn{border-radius:var(--r-s);background:var(--accent);color:var(--on-brand)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.warm{background:var(--ember);color:#fff}
input[type="datetime-local"],input.time,select{border-radius:var(--r-s)}
.pill{font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-brand)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.switch input:checked+span{background:var(--accent)}
.switch input:focus-visible+span{outline-color:var(--accent)}
input[type="range"]{accent-color:var(--accent)}
.stepper button{color:var(--accent);font-weight:600}
.link{color:var(--accent);font-weight:600}
.link:hover{color:var(--ink)}
/* heating activity: the same orange/gold in both apps */
.hx-svg .bar{fill:var(--c-activity)}.hx-svg .bar.est{stroke:var(--c-activity)}
.legend .est-key{border-color:var(--c-activity)}
.ebar .fill{background:var(--c-activity)}
/* branded dashboard header (the only large gradient surface) */
.brand-hero{background:var(--brand-grad);color:var(--on-brand);border-radius:var(--r);padding:20px 22px 22px;box-shadow:0 14px 32px -18px color-mix(in srgb,var(--brand-deep,#000) 70%,transparent)}
.brand-hero .eyebrow,.brand-hero .sub,.brand-hero .outside span,.brand-hero .facts{color:rgba(255,255,255,.82)}
.brand-hero .outside b,.brand-hero .facts b{color:#fff}
.brand-hero .temp sup{color:rgba(255,255,255,.75)}
.brand-hero .status i{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.brand-hero .status i.hot{background:var(--flame-gold);box-shadow:0 0 0 4px rgba(255,185,0,.28)}
.brand-hero .status i.low{background:#A8E4FA}
.brand-hero .air-note{background:rgba(255,255,255,.15);color:#fff}
.brand-hero .air-note svg{color:var(--flame-gold)}.brand-hero .air-note em,.brand-hero .air-note .chev{color:rgba(255,255,255,.8)}
.brand-hero :focus-visible{outline-color:#fff}
.brand-hero .ava{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
@media (min-width:760px){.temp{font-size:84px}.brand-hero{padding:24px 26px 24px}}
@media (min-width:1180px){.temp{font-size:96px}}
/* ---------- components added for the weekly plans (both apps can use them) ---------- */
.strip.many{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:4px}
.strip.many button:nth-child(4n+1){box-shadow:none}
@media (min-width:760px){.strip.many{grid-template-columns:repeat(7,minmax(0,1fr))}.strip.many button:nth-child(4n+1){box-shadow:-1px 0 0 var(--line)}.strip.many button:first-child{box-shadow:none}}
.rule{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:10px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule input.time{min-width:0;width:128px;padding:10px 12px}
.rule .rm{justify-self:end;color:var(--ink-3);font-weight:500}
.rule .days{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.rule .days .chip{min-width:40px;text-align:center;padding:6px 8px}
.week{display:flex;flex-direction:column}
.wk-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.wk-row:first-child{border-top:0}.wk-row>span{color:var(--ink-3);font-weight:600}.wk-row.now>span{color:var(--accent)}
.wk-row div{display:flex;flex-wrap:wrap;gap:6px 14px}.wk-row em{font-style:normal}.wk-row em.none{color:var(--ink-3)}
.today .tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--c-target);border-radius:2px}
#floors .rooms-card{margin:0}
@media (min-width:760px){#floors .rooms{grid-template-columns:repeat(4,minmax(0,1fr))}}
.en-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px;margin:2px 0 10px}
.en-kpis div{display:flex;flex-direction:column;gap:2px;min-width:0}
.en-kpis span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.en-kpis b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.en-kpis b small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.en-kpis em{font-style:normal;font-size:12.5px;color:var(--ink-3)}
#setup-form .field{margin-top:12px}
#setup-form .field span{font-size:13.5px;font-weight:600;color:var(--ink)}#setup-form .field em{font-style:normal;font-weight:500;color:var(--ink-3);margin-left:6px}
#setup-form .field input{font:inherit;padding:11px 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
#setup-form .field input:focus{outline:2px solid var(--accent);outline-offset:0}
.stays{display:flex;flex-direction:column}
.stay-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 18px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.stay-row:first-child{border-top:0}
.stay-row b{font-weight:600}.stay-row span{color:var(--ink-3);font-size:13px}
.stay-row .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.stay-row .v small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.stay-tot{display:flex;justify-content:space-between;gap:12px;padding-top:12px;margin-top:4px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.stay-tot b{color:var(--ink);font-weight:700}
/* iOS Safari gives date/time fields a fixed minimum width, so they ran past the card's edge on iPhone */
input[type="datetime-local"],input[type="date"],input[type="time"],input.time{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;box-sizing:border-box;text-align:left;font-family:inherit;color:var(--ink)}
input[type="datetime-local"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value,input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.field{min-width:0}
</style>
